<!doctype html>

<title>Santa's Workshop · Assembly</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,800;1,900&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Guida di montaggio IT/EN (generata da guida_web.py: non modificare index.html a mano, modifica questo modello).
   Layout: striscia dei passi in alto (fissa mentre si scorre), sotto il "banco" a tutta larghezza con animazione grande, poi azioni spuntabili e pezzi necessari.
   Un passo si segna fatto quando si spuntano tutte le azioni oppure quando si va avanti con Avanti / freccia destra / Fine. */
:root {
  --bg: #F6F4F0; --panel: #ffffff; --ink: #121316; --muted: #5b5d64; --line: #e0dcd4;
  --brand: #FF5A1F; --blue: #1E80E6; --on-brand: #121316;
  --berry: #C7400F; --berry-soft: #ffe6dc; --pine: #1565C0; --pine-soft: #e1eefc;
  --warn-bg: #fff4cf; --warn-line: #d9a400; --warn-ink: #4d3a00; --stage: #ffffff;
  --f-display: "Montserrat", "Avenir Next", "Segoe UI", sans-serif;
  --f-body: "Poppins", "Avenir Next", "Segoe UI", sans-serif;
  --f-mono: "Poppins", "Avenir Next", "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121316; --panel: #1c1e23; --ink: #f3f1ed; --muted: #a3a5ad; --line: #30333a;
  --berry: #FF7A47; --berry-soft: #3b1e12; --pine: #6db3f5; --pine-soft: #16283b;
  --warn-bg: #352a08; --warn-line: #c99b1d; --warn-ink: #ffe28f; --stage: #f6f4f0; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121316; --panel: #1c1e23; --ink: #f3f1ed; --muted: #a3a5ad; --line: #30333a;
  --berry: #FF7A47; --berry-soft: #3b1e12; --pine: #6db3f5; --pine-soft: #16283b;
  --warn-bg: #352a08; --warn-line: #c99b1d; --warn-ink: #ffe28f; --stage: #f6f4f0; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5 }
button { font: inherit; color: inherit }
:focus-visible { outline: 3px solid var(--berry); outline-offset: 2px; border-radius: 6px }

.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px }
header.top { position: relative; overflow: hidden; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding: 18px 22px; border-radius: 16px; background: #121316; color: #ffffff; border: 1px solid #2a2c33 }
header.top::before, header.top::after { content: ""; position: absolute; top: -10%; bottom: -10%; width: 34px; transform: skewX(-12deg) }
header.top::before { left: -14px; background: #1E80E6 }
header.top::after { right: -14px; background: #FF5A1F }
header.top > * { position: relative; z-index: 1 }
.brandrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding-left: 22px; min-width: 0 }
.brandrow .logo { width: 132px; height: auto; flex: none; color: #ffffff; display: block }
header.top h1 { font-family: var(--f-display); font-style: italic; font-weight: 900; font-size: clamp(1.4rem, 3.2vw, 2.1rem); line-height: 1.02; margin: 0; letter-spacing: -0.02em; text-transform: uppercase; text-wrap: balance }
header.top h1 small { display: block; font-family: var(--f-body); font-style: normal; font-weight: 500; font-size: 0.88rem; color: #c9cbd1; letter-spacing: 0; margin-top: 6px; text-transform: none }
header.top .side { padding-right: 22px }
header.top .lang { border-color: #ffffff }
header.top .lang button { color: #ffffff }
header.top .lang button[aria-pressed="true"] { background: #FF5A1F; color: #121316 }
header.top .prog { color: #c9cbd1 }
header.top .prog .bar { background: #3a3d45 }
header.top .prog .bar i { background: #FF5A1F }
.side { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px }
.lang { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 999px; overflow: hidden }
.lang button { background: none; border: 0; padding: 4px 12px; cursor: pointer; font-family: var(--f-mono); font-weight: 700; font-size: 0.8rem; letter-spacing: 0.06em }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg) }
.prog { display: flex; align-items: center; gap: 10px; font-family: var(--f-mono); font-size: 0.85rem; color: var(--muted) }
.prog .bar { width: 140px; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden }
.prog .bar i { display: block; height: 100%; background: var(--pine); width: 0; transition: width .3s }

.grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; margin-top: 14px; align-items: start }
nav.rail { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); overflow-x: auto; overflow-y: hidden; padding: 8px 0 10px; display: flex; align-items: center; gap: 6px; scrollbar-width: thin; border-bottom: 1px solid var(--line) }
.rail h2 { display: none }
.rail ol { list-style: none; margin: 0; padding: 0; display: flex; gap: 6px }
.rail li { flex: none }
.rail .sep { flex: none; width: 1px; height: 22px; background: var(--line); margin: 0 4px }
.rail button { display: flex; align-items: center; gap: 6px; white-space: nowrap; padding: 6px 10px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; cursor: pointer; font-size: 0.85rem; line-height: 1.2; color: var(--ink) }
.rail button:hover { border-color: var(--brand) }
.rail .lbl { display: none }
.rail button[aria-current="step"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.rail button[aria-current="step"] .lbl { display: inline; max-width: 22ch; overflow: hidden; text-overflow: ellipsis }
.rail .num { font-family: var(--f-mono); font-weight: 700; font-size: 0.8rem; color: var(--berry) }
.rail button[aria-current="step"] .num { color: inherit }
.rail .ok { display: none }
.rail .done button:not([aria-current]) { background: var(--pine-soft); border-color: var(--pine) }
.rail .done .num { color: var(--pine) }
.rail .done .ok { display: inline; color: var(--pine); font-weight: 700; font-size: 0.8rem }
.rail .done button[aria-current] .ok { color: inherit }
.rail .tag { display: none }

main { min-width: 0 }
.head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 18px; align-items: end; margin-bottom: 14px }
.big { font-family: var(--f-display); font-style: italic; font-weight: 900; font-size: clamp(3.4rem, 8vw, 5.6rem); line-height: 0.86; color: var(--brand); padding-right: 0.08em; font-variant-numeric: tabular-nums; grid-row: span 2 }
.eyebrow { font-family: var(--f-mono); font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.badge { background: var(--brand); color: var(--on-brand); font-weight: 600; padding: 2px 8px; border-radius: 4px; letter-spacing: 0.04em }
.head h2 { font-family: var(--f-display); font-style: italic; font-weight: 800; letter-spacing: -0.01em; font-size: clamp(1.5rem, 3.2vw, 2.15rem); line-height: 1.1; margin: 0; text-wrap: balance }

.stage { background: var(--stage); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; position: relative }
.stage img { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; object-fit: contain; max-width: 100%; max-height: max(420px, calc(100vh - 230px)) }
.stage img.schema { aspect-ratio: auto; padding: 18px }
.stage .tools { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px }
.stage .tools button { background: rgba(255, 255, 255, 0.92); color: #121316; border: 1px solid #d0ccc4; border-radius: 999px; padding: 6px 12px; font-size: 0.82rem; cursor: pointer; font-weight: 700 }
.stage .tools button[aria-pressed="true"] { background: #121316; color: #ffffff; border-color: #121316 }
.legend { font-size: 0.85rem; color: var(--muted); margin: 8px 2px 0 }
.figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 14px; margin-top: 16px }
.figs figure { margin: 0; background: #ffffff; border: 1px solid var(--line); border-radius: 12px; padding: 10px }
.figs img { display: block; width: 100%; height: auto; max-width: 100% }
.figs figcaption { font-size: 0.85rem; color: #3b4a43; margin-top: 6px }

.cols { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 28px; margin-top: 24px }
.cols h3 { font-family: var(--f-mono); font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; font-weight: 700 }
ol.todo { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: a }
ol.todo li { counter-increment: a }
ol.todo label { display: grid; grid-template-columns: 2em minmax(0, 1fr); gap: 10px; align-items: start; cursor: pointer; padding: 10px 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); font-size: 1.03rem }
ol.todo input { position: absolute; opacity: 0; pointer-events: none }
ol.todo .tick { width: 2em; height: 2em; border-radius: 50%; border: 2px solid var(--berry); display: grid; place-items: center; font-family: var(--f-mono); font-weight: 700; color: var(--berry); font-size: 0.9rem }
ol.todo .tick::before { content: counter(a) }
ol.todo input:checked + label { background: var(--pine-soft); border-color: transparent; color: var(--muted) }
ol.todo input:checked + label .tick { background: var(--pine); border-color: var(--pine); color: var(--panel) }
ol.todo input:checked + label .tick::before { content: "✓" }
ol.todo input:focus-visible + label { outline: 3px solid var(--berry); outline-offset: 2px }
.warn { margin-top: 14px; background: var(--warn-bg); border: 1.5px solid var(--warn-line); color: var(--warn-ink); border-radius: 10px; padding: 12px 14px; font-size: 0.98rem }
.warn b { display: block; font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 2px }

.parts { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px }
.part { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: grid; grid-template-rows: auto auto 1fr; gap: 4px; min-width: 0 }
.part .pic { background: #ffffff; border-radius: 6px; height: 84px; display: grid; place-items: center; overflow: hidden }
.part .pic img { max-height: 80px; max-width: 100%; object-fit: contain }
.part .q { font-family: var(--f-mono); font-weight: 700; color: var(--berry); font-size: 0.85rem }
.part .n { font-weight: 700; font-size: 0.88rem; line-height: 1.2; overflow-wrap: anywhere }
.part .meta { font-size: 0.76rem; color: var(--muted); line-height: 1.3; display: flex; flex-wrap: wrap; gap: 4px; align-content: start }
.part .chip { font-family: var(--f-mono); font-size: 0.68rem; background: var(--pine-soft); color: var(--pine); padding: 1px 6px; border-radius: 4px; white-space: nowrap }
.part .chip { white-space: normal }
.part .chip.kit { background: var(--berry-soft); color: var(--berry) }
.part .chip.old { background: none; border: 1px dashed var(--line); color: var(--muted) }
.part.reuse { opacity: 0.8 }
.part .nota { width: 100% }

.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line); flex-wrap: wrap }
.pager button { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; cursor: pointer; text-align: left; min-width: 0; max-width: 48% }
.pager button.next { background: var(--brand); color: var(--on-brand); border-color: var(--brand); text-align: right; margin-left: auto }
.pager small { display: block; font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.75 }
.pager button[hidden] { display: none }

/* introduzione */
.intro { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 28px; align-items: start }
.intro .stage img { aspect-ratio: 4 / 3 }
.intro p { margin: 0 0 12px; max-width: 62ch }
.intro h3 { font-family: var(--f-display); font-style: italic; font-weight: 800; font-size: 1.2rem; margin: 18px 0 6px }
.intro h3:first-child { margin-top: 0 }
.intro p b:first-child { font-family: var(--f-body); font-weight: 700; font-size: 1.04rem }
table.viti { border-collapse: collapse; width: 100%; font-size: 0.95rem; font-variant-numeric: tabular-nums }
table.viti td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top }
table.viti td:first-child { font-family: var(--f-mono); font-weight: 700; color: var(--berry); width: 3.2em; text-align: right }
table.viti tr.tot td { border-bottom: 0; font-weight: 700 }
.start { margin-top: 18px; background: var(--brand); color: var(--on-brand); border: 0; border-radius: 10px; padding: 12px 20px; font-weight: 700; cursor: pointer; font-size: 1rem }

@media (max-width: 900px) {
  .cols, .intro { grid-template-columns: minmax(0, 1fr) }
  header.top { padding: 14px 16px } .brandrow { padding-left: 16px } .brandrow .logo { width: 104px } header.top .side { padding-right: 16px; padding-left: 16px }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
  .rail button[aria-current="step"] .lbl { max-width: 14ch }
}
@media (prefers-reduced-motion: reduce) { .prog .bar i { transition: none } }
</style>

era dell'interruttore (IN).", "en": "Switch to OFF. Plug the battery into the free socket of the switch (IN)."}, {"it": "Collega il core al computer con un cavo USB-C, passando dalla finestra sul davanti. Serve un cavo dati (non solo di ricarica), attaccato direttamente al computer.", "en": "Connect the core to the computer with a USB-C cable, through the window at the front. It must be a data cable (not charge only), plugged straight into the computer."}, {"it": "Scarica Thonny da thonny.org (è gratis) e aprilo.", "en": "Download Thonny from thonny.org (it is free) and open it."}, {"it": "In Thonny clicca la scritta in basso a destra e scegli «MicroPython (ESP32)» (foto 1).", "en": "In Thonny click the text in the bottom-right corner and choose \"MicroPython (ESP32)\" (picture 1)."}, {"it": "Clicca dentro la finestra Shell in basso e premi ctrl+C (sul Mac il tasto ctrl, non cmd), anche due volte, finché compare >>>. Non usare il pulsante rosso STOP: riavvia la scheda e la tiene occupata (foto 4).", "en": "Click inside the Shell window at the bottom and press ctrl+C (on a Mac the ctrl key, not cmd), twice if needed, until >>> shows. Do not use the red STOP button: it restarts the board and keeps it busy (picture 4)."}, {"it": "Apri il file main.py dalla cartella firmware del modello. Menu File → Salva con nome (sul Mac: Salva come) → «Dispositivo MicroPython» (foto 2) → lascia il nome main.py → OK.", "en": "Open main.py from the model's firmware folder. File menu → Save as → \"MicroPython device\" (picture 2) → keep the name main.py → OK."}, {"it": "Fai lo stesso con boot.py della cartella firmware. Thonny chiede se sostituire quello che c'è già: rispondi sì. Quando le due linguette mostrano [ main.py ] e [ boot.py ] tra parentesi quadre, i file sono sulla scheda (foto 3).", "en": "Do the same with boot.py from the firmware folder. Thonny asks whether to replace the one already there: answer yes. When the two tabs show [ main.py ] and [ boot.py ] in square brackets, the files are on the board (picture 3)."}, {"it": "Stacca il cavo USB e accendi. Dopo circa 5 secondi il servo 180° si muove piano; dopo circa mezzo minuto il servo 360° gira per qualche secondo e si ferma. Se succede, il programma funziona: spegni.", "en": "Unplug the USB cable and switch on. After about 5 seconds the 180° servo moves slowly; after about half a minute the 360° servo turns for a few seconds and stops. If it does, the program works: switch off."}, {"it": "Accendi, conta fino a 2 e spegni: così il servo 180° (quello dell'elfo) resta nella posizione giusta. Da ora non girare il suo albero a mano.", "en": "Switch on, count to 2 and switch off: this leaves the 180° servo (the elf one) in the right position. From now on do not turn its shaft by hand."}, {"it": "Stacca la batteria dall'interruttore e mettila da parte.", "en": "Unplug the battery from the switch and put it aside."}], "avviso": {"it": "Le luci si accendono più avanti, quando colleghi i LED. Se Thonny non trova la scheda, prova un altro cavo USB-C: molti cavi servono solo per ricaricare.", "en": "The lights come on later, when you connect the LEDs. If Thonny does not find the board, try another USB-C cable: many cables only charge."}, "serve": [{"q": 1, "hw": true, "riuso": false, "img": "img/hw_batteria.png", "nome": {"it": "Batteria 2S", "en": "2S battery"}, "nota": {"it": "carica", "en": "charged"}, "dove": {"it": "kit", "en": "kit"}, "piatto": "", "card": ""}, {"q": 1, "hw": true, "riuso": false, "img": "img/hw_cavo_usb.png", "nome": {"it": "Cavo USB-C dati", "en": "USB-C data cable"}, "nota": {"it": "cavo dati USB-C, tuo", "en": "USB-C data cable, your own"}, "dove": {"it": "il tuo cavo", "en": "your own cable"}, "piatto": "", "card": ""}, {"q": 1, "hw": true, "riuso": true, "img": "img/hw_ricevitore.png", "nome": {"it": "Core + scheda ricevitore", "en": "Core + receiver board"}, "nota": {"it": "il core XA003 sul ricevitore", "en": "the core XA003 on the receiver"}, "dove": {"it": "già icina, presa 2 = lampione. Le prese 3 e 4 restano libere.", "en": "Left hub: socket 1 = workshop, socket 2 = lamp post. Sockets 3 and 4 stay free."}, {"it": "Hub destro: presa 1 = stella (LED A), presa 2 = palline (LED B), presa 3 = slitta, presa 4 = lanterna dell'elfo.", "en": "Right hub: socket 1 = star (LED A), socket 2 = baubles (LED B), socket 3 = sleigh, socket 4 = elf lantern."}, {"it": "Ora avvita gli hub. Hub sinistro (dal lato dell'interruttore, verso la parete laterale): scheda sui suoi appoggi, prese verso di te, ingresso bianco rivolto verso il centro della base, 1 vite M2.5 × 6. Hub destro (dietro il vano del cassetto): stesso modo, 1 vite.", "en": "Now screw the hubs down. Left hub (on the switch side, near the side wall): board on its supports, sockets toward you, white input facing the centre of the base, 1 M2.5 × 6 screw. Right hub (behind the drawer bay): same way, 1 screw."}, {"it": "Il filo della slitta scende fuori dal vano del cassetto e passa sopra la staffa del servo 180°. Non farlo passare dentro il vano.", "en": "The sleigh wire comes down outside the drawer bay and runs over the bracket of the 180° servo. Do not route it inside the bay."}, {"it": "Prova: innesta la batteria nella presa IN dell'interruttore e accendi. Si accendono officina, lampione, stella e palline; le lanterne di slitta ed elfo lampeggiano verdi. Spegni entro 20 secondi.", "en": "Test: plug the battery into the IN socket of the switch and switch on. Workshop, lamp post, star and baubles light up; the sleigh and elf lanterns blink green. Switch off within 20 seconds."}, {"it": "Se due luci sono scambiate, scambia le due spine. Poi lascia la batteria collegata per il prossimo passo.", "en": "If two lights are swapped, swap the two plugs. Then leave the battery plugged in for the next step."}], "avviso": {"it": "I fili dei LED sono lunghi 100 mm e non si allungano. Se uno sembra corto, controlla di averlo fatto scendere nel foro giusto. Durante la prova il braccio dell'elfo si muove: tieni le dita lontane.", "en": "The LED wires are 100 mm long and cannot be extended. If one seems short, check that it went down the right hole. During the test the elf arm moves: keep your fingers away."}, "serve": [{"q": 6, "hw": true, "riuso": true, "img": "img/hw_led.png", "nome": {"it": "LED con filo", "en": "LED with wire"}, "nota": {"it": "i fili dei 6 LED già sotto la base", "en": "the wires of the 6 LEDs already under the base"}, "dove": {"it": "già usato in un passo prima", "en": "already used in an earlier step"}, "piatto": "", "card": ""}, {"q": 2, "hw": true, "riuso": true, "img": "img/hw_hub.png", "nome": {"it": "Hub LED", "en": "LED hub"}, "nota": {"it": "ancora sciolti", "en": "still loose"}, "dove": {"it": "già usato in un passo prima", "en": "already used in an earlier step"}, "piatto": "", "card": ""}, {"q": 2, "hw": true, "riuso": false, "img": "img/hw_vite_m25.png", "nome": {"it": "Vite M2.5 × 6", "en": "Screw M2.5 × 6"}, "nota": {"it": "1 per hub", "en": "1 per hub"}, "dove": {"it": "kit", "en": "kit"}, "piatto": "", "card": ""}, {"q": 1, "hw": true, "riuso": true, "img": "img/hw_batteria.png", "nome": {"it": "Batteria 2S", "en": "2S battery"}, "nota": {"it": "per la prova", "en": "for the test"}, "dove": {"it": "già usato in un passo prima", "en": "already used in an earlier step"}, "piatto": "", "card": ""}], "gif": "img/passo_21.gif", "png": "img/passo_21.png", "figure": [{"img": {"it": "img/schema_cavi_it.svg", "en": "img/schema_cavi_en.svg"}, "didascalia": {"it": "Schema di tutti i collegamenti (base capovolta).", "en": "Diagram of all connections (base upside down)."}}, {"img": "img/fig_foto_passo21_cavi_led.jpg", "didascalia": {"it": "Foto reale: la base vista da sotto alla fine di questo passo. 1 interruttore, 2 ricevitore, 3 hub sinistro, 4 hub destro, 5 LED dell'officina con il tappo a U, 6 filo del lampione, 7 LED della stella, 8 LED delle palline (dai due fori dell'albero), 9 servo 360°, 10 servo 180°.", "en": "Real photo: the base seen from below at the end of this step. 1 switch, 2 receiver, 3 left hub, 4 right hub, 5 workshop LED with the U clip, 6 lamp post wire, 7 star LED, 8 bauble LED (from the two tree holes), 9 360° servo, 10 180° servo."}}]}, {"n": 22, "titolo": {"it": "Batteria e coperchio", "en": "Battery and bottom lid"}, "fase": {"it": "Luci e chiusura", "en": "Lights and closing"}, "azioni": [{"it": "Interruttore su OFF. Appoggia il coperchio sul tavolo con la culla della batteria verso l'alto.", "en": "Switch to OFF. Lay the lid on the table with the battery cradle up."}, {"it": "Metti la batteria nella culla, con il filo che esce dalla feritoia della parete corta.", "en": "Put the battery in the cradle, with the wire leaving through the slot in the short wall."}, {"it": "Appoggia la staffa sulle 2 colonnine ai lati della culla, sopra la batteria, e avvitala con 2 viti M2.5 × 6.", "en": "Lay the strap on the 2 posts beside the cradle, over the battery, and fix it with 2 M2.5 × 6 screws."}, {"it": "Solo adesso, con batteria e staffa già sul coperchio, unisci coperchio e base: gira la base su un fianco, tenendola con una mano, e avvicina il coperchio. La spina della batteria resta nella presa IN dell'interruttore.", "en": "Only now, with battery and strap already on the lid, join lid and base: turn the base on its side, holding it with one hand, and bring the lid close. The battery plug stays in the IN socket of the switch."}, {"it": "Guarda dall'apertura dello sportello: dentro, a destra, c'è un piolo che scende dal piano. Il filo della batteria deve restare a SINISTRA di quel piolo.", "en": "Look through the door opening: inside, on the right, a post comes down from the top plate. The battery wire must stay to the LEFT of that post."}, {"it": "Chiudi il coperchio senza schiacciare fili e avvita le 6 viti M2.5 × 6 nelle colonnine della base.", "en": "Close the lid without pinching any wire and drive the 6 M2.5 × 6 screws into the posts of the base."}, {"it": "Raddrizza la base.", "en": "Turn the base upright."}], "avviso": {"it": "Sul coperchio ci sono un piolo per lo sportello e un pernino basso per il cassetto: non sono difetti, non toglierli.", "en": "The lid has a post for the door and a low pin for the drawer: they are not defects, do not remove them."}, "serve": [{"q": 1, "hw": false, "riuso": false, "img": "img/coperchio.png", "nome": {"it": "Bottom lid", "en": "Bottom lid"}, "nota": {"it": "", "en": ""}, "dove": {"it": "P2 Bottom lid - White", "en": "P2 Bottom lid - White"}, "piatto": "P2 Bottom lid - White", "card": ""}, {"q": 1, "hw": false, "riuso": false, "img": "img/fermo_batteria.png", "nome": {"it": "Battery strap", "en": "Battery strap"}, "nota": {"it": "staffa della batteria", "en": "battery strap"}, "dove": {"it": "P3 Snow cover and snowman - White", "en": "P3 Snow cover and snowman - White"}, "piatto": "P3 Snow cover and snowman - White", "card": ""}, {"q": 1, "hw": true, "riuso": true, "img": "img/hw_batteria.png", "nome": {"it": "Batteria 2S", "en": "2S battery"}, "nota": {"it": "già collegata alla presa IN", "en": "already plugged into IN"}, "dove": {"it": "già usato in un passo prima", "en": "already used in an earlier step"}, "piatto": "", "card": ""}, {"q": 8, "hw": true, "riuso": false, "img": "img/hw_vite_m25.png", "nome": {"it": "Vite M2.5 × 6", "en": "Screw M2.5 × 6"}, "nota": {"it": "2 staffa + 6 coperchio", "en": "2 strap + 6 lid"}, "dove": {"it": "kit", "en": "kit"}, "piatto": "", "card": ""}], "gif": "img/passo_22.gif", "png": "img/passo_22.png", "figure": []}, {"n": 23, "titolo": {"it": "Cassetto dei regali", "en": "Gift drawer"}, "fase": {"it": "Luci e chiusura", "en": "Lights and closing"}, "azioni": [{"it": "Con una lama togli il brim rimasto nei due angoli in basso dietro la pelle frontale del cassetto. Se resta, il frontale non appoggia piatto sulla parete.", "en": "With a blade trim the brim left in the two bottom corners behind the front skin of the drawer. If it stays, the front does not sit flat on the wall."}, {"it": "Sul fronte, a destra, c'è l'apertura alta del cassetto. Infila il cassetto aperto in alto e spingilo: scorre sul coperchio.", "en": "On the front, on the right, is the tall drawer opening. Slide the drawer in, open side up, and push: it slides on the lid."}, {"it": "A fine corsa senti uno scatto: il pernino del coperchio (un cilindro basso) è passato oltre il dente sotto il cassetto. Ora il cassetto non esce da solo.", "en": "At the end you feel a click: the stop pin on the lid (a low cylinder) has passed the tooth under the drawer. Now the drawer does not slide out by itself."}, {"it": "Per aprirlo tira la linguetta.", "en": "To open it, pull the tab."}], "avviso": null, "serve": [{"q": 1, "hw": false, "riuso": false, "img": "img/cassetto.png", "nome": {"it": "Gift drawer", "en": "Gift drawer"}, "nota": {"it": "", "en": ""}, "dove": {"it": "P4 Tree base, roof, drawer - White", "en": "P4 Tree base, roof, drawer - White"}, "piatto": "P4 Tree base, roof, drawer - White", "card": ""}], "gif": "img/passo_23.gif", "png": "img/passo_23.png", "figure": []}, {"n": 24, "titolo": {"it": "Sportello della ricarica", "en": "Charging door"}, "fase": {"it": "Luci e chiusura", "en": "Lights and closing"}, "azioni": [{"it": "Con una lama togli il brim rimasto nei due angoli in basso dietro la pelle frontale dello sportello.", "en": "With a blade trim the brim left in the two bottom corners behind the front skin of the door."}, {"it": "Sul fronte, a sinistra, c'è l'apertura dello sportello. Dentro a destra vedi due pioli: uno in alto (della base) e uno in basso (del coperchio).", "en": "On the front, on the left, is the door opening. Inside on the right you see two posts: one at the top (base) and one at the bottom (lid)."}, {"it": "Controlla che il filo della batteria sia a sinistra del piolo in alto.", "en": "Check that the battery wire is to the left of the upper post."}, {"it": "Presenta lo sportello quasi dritto, con la cima appena verso di te ps, the ring starts."}], "avviso": {"it": "Prima accensione: se dopo i primi secondi il braccio esce verso l'albero invece che verso la slitta, spegni subito e nel programma metti ELF_DIR = -1. Se non fai in tempo a caricare, spegni e riaccendi.", "en": "First run: if after the first seconds the arm swings toward the tree instead of toward the sleigh, switch off at once and set ELF_DIR = -1 in the program. If you run out of loading time, switch off and on again."}, "serve": [{"q": 1, "hw": true, "riuso": true, "img": "img/hw_interruttore.png", "nome": {"it": "Modulo interruttore", "en": "Switch module"}, "nota": {"it": "il cursore sul fronte", "en": "the slider on the front"}, "dove": {"it": "già usato in un passo prima", "en": "already used in an earlier step"}, "piatto": "", "card": ""}, {"q": 6, "hw": false, "riuso": true, "img": "img/regalo1.png", "nome": {"it": "Gift 1 box", "en": "Gift 1 box"}, "nota": {"it": "i 6 regali con nastri e magnete", "en": "the 6 gifts with ribbons and magnet"}, "dove": {"it": "già usato in un passo prima", "en": "already used in an earlier step"}, "piatto": "P5 Workshop, gifts and Santa - Red", "card": ""}], "gif": "img/passo_30.gif", "png": "img/passo_30.png", "figure": []}, {"n": 31, "titolo": {"it": "Come funziona e regolazioni", "en": "How it runs and settings"}, "fase": {"it": "Accensione", "en": "Switch on"}, "azioni": [{"it": "L'anello fa un primo tratto e si ferma con il posto vuoto davanti all'elfo. Poi i regali cadono uno alla volta, a momenti casuali: l'elfo aspetta da 8 a 25 secondi, ogni volta un tempo diverso. Ogni tanto l'elfo fa una finta: il braccio entra nel posto vuoto ed esce mentre l'anello resta fermo, quindi non cade niente. Poi il braccio entra davvero, l'anello avanza di un posto, un regalo scivola contro la lama e cade nella slitta e nel cassetto, il braccio esce. L'anello si ferma sempre con i regali sulle calamite.", "en": "The ring makes a first move and stops with the empty spot in front of the elf. Then the gifts drop one at a time, at random moments: the elf waits 8 to 25 seconds, a different time every time. Now and then the elf fakes: the arm swings into the empty spot and back out while the ring stays still, so nothing drops. Then the arm swings in for real, the ring moves one spot, a gift slides along the blade and drops through the sleigh into the drawer, the arm swings out. The ring always stops with the gifts on their magnets."}, {"it": "A ogni regalo le palline dell'albero si abbassano di un gradino. La stella resta accesa.", "en": "With every gift the tree baubles dim one step. The star stays on."}, {"it": "Dopo il sesto regalo le lanterne restano rosse per un minuto, poi la scena resta accesa. Spegni, tira la linguetta del cassetto e prendi i regali. Per ricominciare: cassetto chiuso, anello vuoto, accendi.", "en": "After the sixth gift the lanterns glow red for a minute, then the scene stays lit. Switch off, pull the drawer tab and take the gifts. To start again: drawer closed, ring empty, switch on."}, {"it": "Verso dell'anello: visto da sopra deve girare in senso antiorario. Se gira al contrario cambia il segno di RING_SPEED in testa a main.py e salva di nuovo sul core.", "en": "Ring direction: seen from above it must turn counter-clockwise. If it turns the other way, flip the sign of RING_SPEED at the top of main.py and save it to the core again."}, {"it": "Se il braccio scende su un regalo invece che nel posto vuoto, l'anello non si ferma dove deve: misura con il telefono i secondi di un giro completo dell'anello e scrivili in RING_TURN_S. Per piccoli ritocchi usa STOP_TRIM_S.", "en": "If the arm comes down on a gift instead of the empty spot, the ring is not stopping where it should: time one full turn of the ring with a phone and write the seconds in RING_TURN_S. For small corrections use STOP_TRIM_S."}, {"it": "Altre regolazioni in testa a main.py: LOAD_S = secondi per caricare, ELF_WORK = angolo del braccio di traverso, PAUSE_MIN_S e PAUSE_MAX     ${(p.figure || []).length ? `<div class="figs">${p.figure.map(f => `<figure><img src="${t(f.img)}" alt="${esc(t(f.didascalia))}" loading="lazy"><figcaption>${esc(t(f.didascalia))}</figcaption></figure>`).join('')}</div>` : ''}
    <div class="cols">
      <section><h3>${esc(u.fare)}</h3><ol class="todo">${p.azioni.map((a, k) => `<li><input type="checkbox" id="a${p.n}-${k}" ${az[k] ? 'checked' : ''}><label for="a${p.n}-${k}"><span class="tick" aria-hidden="true"></span><span>${esc(t(a))}</span></label></li>`).join('')}</ol>
        ${p.avviso ? `<div class="warn" role="note"><b>${esc(u.att)}</b>${esc(t(p.avviso))}</div>` : ''}</section>
      <section><h3>${esc(u.serve)}</h3><div class="parts">${p.serve.map(pezzo).join('')}</div></section>
    </div>
    <div class="pager">${prev ? `<button id="b-prev"><small>${esc(u.indietro)}</small>${esc(nomeDi(prev))}</button>` : ''}${next ? `<button class="next" id="b-next"><small>${esc(u.passo)} ${pad(PASSI[i + 1].n)} →</small>${esc(nomeDi(next))}</button>` : `<button class="next" id="b-fine"><small>${esc(u.fine)}</small>${esc(u.torna)}</button>`}</div>`;
}

function vai(id, scroll = true) {
  if (!ORD.includes(id)) id = 'inizio';
  cur = id;
  const m = document.getElementById('main');
  const p = PASSI.find(x => 'passo-' + x.n === id);
  m.innerHTML = p ? passo(p) : intro();
  if (p) bind(p); else document.getElementById('go').onclick = () => vai(ORD[1]);
  testata(); rail();
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
  if (scroll) window.scrollTo({ top: 0, behavior: lento ? 'auto' : 'smooth' });
}

function fatto(p) { stato.fatti[p.n] = true; salva(); }

function bind(p) {
  const img = document.getElementById('media');
  const set = a => { anim = a; img.src = a ? p.gif : p.png; document.getElementById('b-anim').setAttribute('aria-pressed', a); document.getElementById('b-ris').setAttribute('aria-pressed', !a); document.getElementById('b-rep').hidden = !a; };
  if (img) {
    document.getElementById('b-anim').onclick = () => set(true);
    document.getElementById('b-ris').onclick = () => set(false);
    document.getElementById('b-rep').onclick = () => { img.src = p.png; requestAnimationFrame(() => { img.src = p.gif; }); };
  }
  document.querySelectorAll('ol.todo input').forEach((c, k) => c.onchange = () => {
    const az = stato.azioni[p.n] = stato.azioni[p.n] || [];
    az[k] = c.checked;
    if (p.azioni.every((_, j) => az[j])) stato.fatti[p.n] = true;
    salva(); rail();
  });
  const pr = document.getElementById('b-prev'), nx = document.getElementById('b-next'), fi = document.getElementById('b-fine');
  const idx = ORD.indexOf('passo-' + p.n);
  if (pr) pr.onclick = () => vai(ORD[idx - 1]);
  if (nx) nx.onclick = () => { fatto(p); vai(ORD[idx + 1]); };
  if (fi) fi.onclick = () => { fatto(p); vai('inizio'); };
}

const lingua = l => { L = l; stato.lang = l; salva(); vai(cur, false); };
document.getElementById('l-it').onclick = () => lingua('it');
document.getElementById('l-en').onclick = () => lingua('en');
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea') || e.altKey || e.metaKey || e.ctrlKey) return;
  const i = ORD.indexOf(cur);
  if (e.key === 'ArrowRight' && i < ORD.length - 1) { const p = PASSI.find(x => 'passo-' + x.n === cur); if (p) fatto(p); vai(ORD[i + 1]); }
  if (e.key === 'ArrowLeft' && i > 0) vai(ORD[i - 1]);
});
vai(location.hash.slice(1) || 'inizio', false);
</script>
